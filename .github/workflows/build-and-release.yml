name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/3.x", "release/4.x"]
    tags: ["version-*"]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PROJECT_PATH: CollimationCircles/CollimationCircles.csproj
  FRAMEWORK: net10.0
  APP_NAME: CollimationCircles
  DOTNET_VERSION: "10.0.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
            index: 1
          - runtime: win-arm64
            os: windows-latest
            index: 2
          - runtime: linux-x64
            os: ubuntu-latest
            index: 3
          - runtime: linux-arm64
            os: ubuntu-latest
            index: 4
          - runtime: osx-x64
            os: macos-latest
            index: 5
          - runtime: osx-arm64
            os: macos-latest
            index: 6

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from csproj
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "${{ env.PROJECT_PATH }}" -Raw
          # Regex matches <Version>, <VersionPrefix>, or <InformationalVersion>
          if ($content -match '<(?:InformationalVersion|Version|VersionPrefix)>(.*?)<\/') {
              $v = $Matches[1].Trim()
          } else {
              $v = "1.0.0"
          }
          Write-Host "Detected Version: $v"
          echo "APP_VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} -r ${{ matrix.runtime }} /p:RuntimeIdentifier=${{ matrix.runtime }} /p:PublishReadyToRun=true

      - name: Publish
        shell: pwsh
        run: |
          $publishArgs = @(
            "publish", "${{ env.PROJECT_PATH }}",
            "-c", "Release",
            "-r", "${{ matrix.runtime }}",
            "-o", "./publish/${{ matrix.runtime }}",
            "--self-contained", "true",
            "--no-restore",
            "/p:PublishSingleFile=true",
            "/p:PublishReadyToRun=true",
            "/p:PublishTrimmed=true",
            "/p:TrimMode=full",
            "/p:DebugType=None",
            "/p:DebugSymbols=false"
          )
          if ("${{ matrix.runtime }}".StartsWith("osx-")) {
            $publishArgs += "/p:UseAppHost=true"
          }
          dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "Publish failed for ${{ matrix.runtime }}" }
          $nativeLibrary = if ("${{ matrix.runtime }}".StartsWith("win-")) { "OpenCvSharpExtern.dll" } elseif ("${{ matrix.runtime }}".StartsWith("osx-")) { "libOpenCvSharpExtern.dylib" } else { "libOpenCvSharpExtern.so" }
          if (-not (Test-Path "./publish/${{ matrix.runtime }}/$nativeLibrary" -PathType Leaf)) {
            throw "Missing OpenCV native library $nativeLibrary for ${{ matrix.runtime }}"
          }
          if ("${{ matrix.runtime }}".StartsWith("osx-")) {
            $header = [System.IO.File]::ReadAllBytes("./publish/${{ matrix.runtime }}/$nativeLibrary")[0..7]
            $cpuType = [BitConverter]::ToUInt32($header, 4)
            $expected = if ("${{ matrix.runtime }}" -eq "osx-arm64") { 0x0100000C } else { 0x01000007 }
            if ([BitConverter]::ToUInt32($header, 0) -ne 0xFEEDFACFL -or $cpuType -ne $expected) {
              throw ("OpenCV native library architecture mismatch for ${{ matrix.runtime }} (cputype 0x{0:X8})" -f $cpuType)
            }
          }

      - name: Remove Homebrew dependencies from OpenCV library (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          DIR="./publish/${{ matrix.runtime }}"
          LIB="$DIR/libOpenCvSharpExtern.dylib"
          ARCH="${{ matrix.runtime }}"
          ARCH="${ARCH#osx-}"
          if [ "$ARCH" = "x64" ]; then ARCH="x86_64"; fi

          # The official x64 OpenCV runtime links Homebrew's libavif by absolute path, which does not exist on user machines.
          # OpenCV only uses it for AVIF images, so the dependency is redirected to a stub exporting the imported symbols.
          for dep in $(otool -L "$LIB" | tail -n +2 | awk '{print $1}' | grep -E '^(/usr/local|/opt/homebrew)/' || true); do
            name="$(basename "$dep")"
            short="${name%%.*}"
            echo "Replacing $dep with a stub"

            nm -um "$LIB" | grep -E "\(from ${short}([.)])" | awk '{print $3}' | sort -u > "$RUNNER_TEMP/$short.symbols"
            if [ ! -s "$RUNNER_TEMP/$short.symbols" ]; then
              echo "::error::No imported symbols found for $short"
              nm -um "$LIB" | head -n 20
              exit 1
            fi

            : > "$RUNNER_TEMP/$short.c"
            while read -r sym; do
              printf 'void *%s(void) { return 0; }\n' "${sym#_}" >> "$RUNNER_TEMP/$short.c"
            done < "$RUNNER_TEMP/$short.symbols"

            clang -arch "$ARCH" -dynamiclib -mmacosx-version-min=11.0 -install_name "@loader_path/$name" -o "$DIR/$name" "$RUNNER_TEMP/$short.c"
            install_name_tool -change "$dep" "@loader_path/$name" "$LIB"
            codesign --force --sign - "$DIR/$name" "$LIB"
          done

          otool -L "$LIB"
          if otool -L "$LIB" | tail -n +2 | grep -E '^[[:space:]]*(/usr/local|/opt/homebrew)/'; then
            echo "::error::OpenCV native library still depends on Homebrew libraries"
            exit 1
          fi

      - name: Make OpenCV library loadable on older macOS (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          LIB="./publish/${{ matrix.runtime }}/libOpenCvSharpExtern.dylib"

          # The OpenCV runtime imports symbols that only exist on recent macOS (e.g. VideoToolbox pixel rotation),
          # which makes dyld reject the whole library on older systems. Weak imports resolve to NULL instead.
          python3 .github/scripts/weaken-macos-imports.py "$LIB"
          codesign --force --sign - "$LIB"
          codesign --verify --verbose "$LIB"

      - name: Package (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        shell: bash
        run: |
          output="./publish/${{ matrix.runtime }}"
          chmod +x "$output/${{ env.APP_NAME }}"
          tarName="./publish/${{ matrix.index }}-${{ env.APP_NAME }}-${{ steps.version.outputs.APP_VERSION }}-${{ matrix.runtime }}.tar.gz"
          tar -czf "$tarName" -C "$output" .

      - name: Package (Windows)
        if: startsWith(matrix.runtime, 'win-')
        shell: pwsh
        run: |
          $output = "./publish/${{ matrix.runtime }}"
          $zipName = "./publish/${{ matrix.index }}-${{ env.APP_NAME }}-${{ steps.version.outputs.APP_VERSION }}-${{ matrix.runtime }}.zip"
          Compress-Archive -Force "$output/*" $zipName

      - name: Package (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        run: |
          RID="${{ matrix.runtime }}"
          VER="${{ steps.version.outputs.APP_VERSION }}"
          APP="${{ env.APP_NAME }}"
          BUNDLE="$APP.app"
          CP="./publish/${RID}_bundle/$BUNDLE/Contents"

          mkdir -p "$CP/MacOS"
          mkdir -p "$CP/Resources"

          printf '<?xml version="1.0" encoding="utf-8"?>\n' > "$CP/Info.plist"
          printf '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' >> "$CP/Info.plist"
          printf '<plist version="1.0">\n<dict>\n' >> "$CP/Info.plist"
          printf '  <key>CFBundleIconFile</key><string>icon.icns</string>\n' >> "$CP/Info.plist"
          printf '  <key>CFBundleIdentifier</key><string>com.saimons.%s</string>\n' "$APP" >> "$CP/Info.plist"
          printf '  <key>CFBundleName</key><string>%s</string>\n' "$APP" >> "$CP/Info.plist"
          printf '  <key>CFBundleVersion</key><string>%s</string>\n' "$VER" >> "$CP/Info.plist"
          printf '  <key>CFBundleExecutable</key><string>%s</string>\n' "$APP" >> "$CP/Info.plist"
          printf '  <key>CFBundlePackageType</key><string>APPL</string>\n' >> "$CP/Info.plist"
          printf '  <key>LSMinimumSystemVersion</key><string>11.0</string>\n' >> "$CP/Info.plist"
          printf '  <key>NSCameraUsageDescription</key><string>CollimationCircles uses the camera to display the live collimation stream.</string>\n' >> "$CP/Info.plist"
          printf '  <key>NSMicrophoneUsageDescription</key><string>CollimationCircles may access microphone audio when opening AVFoundation capture devices.</string>\n' >> "$CP/Info.plist"
          printf '</dict>\n</plist>\n' >> "$CP/Info.plist"

          cp -R "./publish/$RID/"* "$CP/MacOS/"
          [ -f "$CP/MacOS/icon.icns" ] && mv "$CP/MacOS/icon.icns" "$CP/Resources/"
          chmod +x "$CP/MacOS/$APP"

          TAR_NAME="./publish/${{ matrix.index }}-$APP-$VER-$RID.tar.gz"
          tar -czf "$TAR_NAME" -C "./publish/${RID}_bundle" "$BUNDLE"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.runtime }}
          path: |
            ./publish/*.zip
            ./publish/*.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
